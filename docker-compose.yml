services:
  app:
    build:
      context: .
      target: development
    # user: "${UID:-0}:${GID:-0}"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle:cached
    ports:
      - "3000:3000"
      - "3036:3036"
    environment:
      APP_HOST: ${APP_HOST:-heimv.localhost:3000}
      E2E_SERVER_PORT: "3001"
      E2E_TARGET_HOST: "app.test:3001"
      SELENIUM_HOST: "selenium:4444"
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"
      SMTP_SETTINGS: '{ "address":"mail", "port": 1025, "enable_starttls": false }'
      MAIL_FROM: "no-reply@heimverwaltung.localhost"
      REDIS_URL: "redis://valkey/0"
      TRANSLATION_IO_API_KEY: ${TRANSLATION_IO_API_KEY}
      PRIVACY_STATEMENT_URL: ${PRIVACY_STATEMENT_URL}
      GITHUB_URL: ${GITHUB_URL}
      RAILS_PERFORM_CACHING: ${RAILS_PERFORM_CACHING}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      - db
      - mail
      - valkey
    tty: true
    stdin_open: true
    networks:
      main_network:
      selenium_network:
        aliases:
          - "app.test"

    # noVNC in browser with password «secret»
  selenium:
    image: ${SELENIUM_IMAGE:-selenium/standalone-chrome}
    shm_size: 2g
    networks:
      selenium_network:
    ports:
      - "7900:7900"

  db:
    image: postgres:18
    volumes:
      - db_data:/var/lib/postgresql/docker
    environment:
      POSTGRES_DB: heimv_e2e
      POSTGRES_PASSWORD: postgres
    networks:
      main_network:

  valkey:
    image: valkey/valkey
    networks:
      main_network:

  mail:
    image: sj26/mailcatcher
    ports:
      - "1080:1080"
    networks:
      main_network:

volumes:
  db_data:
  bundle:

networks:
  selenium_network:
    driver: bridge
  main_network:
    driver: bridge
